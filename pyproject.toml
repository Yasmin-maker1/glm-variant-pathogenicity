[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glmvar"
version = "0.1.0"
description = "Fine-tuning genomic language models for pathogenic vs. benign variant classification, compared with CADD"
authors = [{ name = "Yasmin Orduz" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "tabulate>=0.9",
  "torch>=2.1",
  "transformers>=4.40,<5",
  "peft>=0.10",
  "einops>=0.7",
]

[project.optional-dependencies]
bio = ["pysam>=0.22"]
dev = ["pytest>=7"]

[project.scripts]
glmvar = "glmvar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
